services:
  surrealdb:
    image: surrealdb/surrealdb:v3
    restart: always
    command: start --user root --pass root --bind 0.0.0.0:8000 rocksdb:/data/surreal.db
    volumes:
      - ./surreal-data:/data
    ports:
      - "8000:8000"
  postgresql:
    image: postgres:11-alpine
    restart: always
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=actix
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
